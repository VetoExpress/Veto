name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win

          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建逻辑全部交给 package.json
      #
      # Windows:
      # pnpm run build:win
      #
      # macOS:
      # pnpm run build:mac
      - name: Build
        run: pnpm run build:${{ matrix.platform }}

      # 构建结果位于：
      # Veto/apps/electron/dist
      - name: Show build output
        shell: bash
        run: |
          echo "Build output:"
          find apps/electron/dist -maxdepth 1 -type f -print

      # ==========================================
      # 收集发布文件
      # ==========================================
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p release-files

          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const source = path.join(
            'apps',
            'electron',
            'dist'
          );

          const target = 'release-files';

          if (!fs.existsSync(source)) {
            console.error(
              `Build directory not found: ${source}`
            );
            process.exit(1);
          }

          // Electron Builder 常见发布产物
          const allowed =
            /\.(exe|dmg|zip|yml|yaml|blockmap)$/i;

          for (const file of fs.readdirSync(source)) {
            const src = path.join(source, file);

            if (
              fs.statSync(src).isFile() &&
              allowed.test(file)
            ) {
              console.log(`Collect: ${file}`);

              fs.copyFileSync(
                src,
                path.join(target, file)
              );
            }
          }

          const files = fs.readdirSync(target);

          if (files.length === 0) {
            console.error(
              `No release files found in ${source}`
            );
            process.exit(1);
          }

          console.log('');
          console.log('Release files:');

          for (const file of files) {
            console.log(` - ${file}`);
          }
          EOF

      # ==========================================
      # 上传 Actions Artifact
      #
      # 后面的 release job 会把 Windows / macOS
      # 的文件统一下载下来发布 GitHub Release
      # ==========================================
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: veto-${{ matrix.platform }}
          path: release-files/*
          if-no-files-found: error

      # ==========================================
      # 上传 Cloudflare R2
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto

          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

        run: |
          echo "Uploading ${{ matrix.platform }} files to R2..."

          aws s3 cp \
            release-files/ \
            "s3://${R2_BUCKET}/releases/${GITHUB_REF_NAME}/" \
            --recursive \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

  # ==================================================
  # GitHub Release
  #
  # 等待 Windows 和 macOS 都完成后，
  # 再统一创建 GitHub Release。
  # ==================================================
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: veto-*
          path: artifacts

      - name: Show release files
        run: |
          echo "Files:"
          find artifacts -type f -print

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e

          echo "Release tag: $TAG"

          # Release 不存在就创建
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes
          fi

          echo "Files to upload:"
          find artifacts -type f -print

          # 一个文件一个文件上传，避免复杂的 Bash 数组/括号语法
          while IFS= read -r file; do
            echo "Uploading: $file"

            gh release upload "$TAG" "$file" \
              --repo "$REPO" \
              --clobber
          done < <(find artifacts -type f)

          echo "GitHub Release upload completed."

      - name: Generate latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DOWNLOAD_BASE: https://download.miaoyww.top
        run: |
          VERSION="${TAG#v}"

          WIN_FILE=$(find artifacts -type f -name "*.exe" | head -1)
          MAC_FILE=$(find artifacts -type f -name "*.dmg" | head -1)

          WIN_NAME=$(basename "$WIN_FILE")
          MAC_NAME=$(basename "$MAC_FILE")

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "tag": "${TAG}",
            "windows": {
              "url": "${DOWNLOAD_BASE}/releases/${TAG}/${WIN_NAME}"
            },
            "macArm64": {
              "url": "${DOWNLOAD_BASE}/releases/${TAG}/${MAC_NAME}"
            }
          }
          EOF

          cat latest.json

      - name: Generate electron-updater metadata for R2
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          DOWNLOAD_BASE: https://download.miaoyww.top
        run: |
          node <<'EOF'
          const fs = require('fs');

          const tag = process.env.TAG;
          const baseUrl = new URL(`/releases/${encodeURIComponent(tag)}/`, `${process.env.DOWNLOAD_BASE}/`);
          const targets = [
            { input: 'artifacts/veto-win/latest.yml', output: 'latest.yml' },
            { input: 'artifacts/veto-mac/latest-mac.yml', output: 'latest-mac.yml' },
          ];

          function absolutizeUpdateFileUrl(line) {
            const match = line.match(/^(\s*(?:-\s+)?(?:url|path):\s*)(["']?)([^"'\n]+)\2\s*$/);

            if (!match || /^[a-z][a-z\d+\-.]*:/i.test(match[3])) {
              return line;
            }

            const encodedFileName = match[3].split('/').map(encodeURIComponent).join('/');
            return `${match[1]}${JSON.stringify(new URL(encodedFileName, baseUrl).toString())}`;
          }

          for (const target of targets) {
            if (!fs.existsSync(target.input)) {
              console.error(`Missing electron-updater metadata: ${target.input}`);
              process.exit(1);
            }

            const metadata = fs
              .readFileSync(target.input, 'utf8')
              .split(/\r?\n/)
              .map(absolutizeUpdateFileUrl)
              .join('\n');
            fs.writeFileSync(target.output, `${metadata}\n`);
            console.log(`Generated ${target.output}`);
          }
          EOF

      - name: Upload electron-updater metadata to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto

          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

        run: |
          set -e

          for file in latest.yml latest-mac.yml; do
            aws s3 cp "$file" \
              "s3://${R2_BUCKET}/releases/$file" \
              --content-type "text/yaml; charset=utf-8" \
              --cache-control "no-cache" \
              --region auto \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          done

      - name: Upload latest.json to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_DEFAULT_REGION: auto

          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}

        run: |
          aws s3 cp latest.json \
            "s3://${R2_BUCKET}/releases/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache" \
            --region auto \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
